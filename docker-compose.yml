services:
  kudos:
    build: .
    ports:
      - "8000:8000"
    environment:
      KUDOS_DB: /data/kudos.db
      KUDOS_SESSION_TTL_HOURS: "8"
      # Local compose serves plain HTTP. Set to "1" behind TLS.
      KUDOS_SECURE_COOKIES: "0"
    volumes:
      - kudos-data:/data
    command:
      - sh
      - -c
      - python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

volumes:
  kudos-data:
